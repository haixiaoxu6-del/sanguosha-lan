<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'HuangCao'; src: url('/assets/fonts/huangcao.woff2') format('woff2'); font-display: swap; }
body { margin:0; background:#8a6a4a; padding:30px; display:flex; gap:26px; font-family:"FZBWKSJW",serif; }
.c { width:164px; height:230px; background:linear-gradient(180deg,#f7efdb,#ead9b8); border:1px solid #8c6b3f; border-radius:6px;
  box-shadow:0 6px 16px rgba(0,0,0,.4); position:relative; overflow:hidden; color:#1c140c; }
.c .top { position:absolute; top:4px; left:5px; width:24px; text-align:center; z-index:3; }
.c .num { font-size:19px; font-weight:800; line-height:1; color:#a52626; }
.c .suit { font-size:16px; line-height:1; color:#a52626; }
.c.black .num, .c.black .suit { color:#1c140c; }
.c .name { position:absolute; z-index:3; font-family:'HuangCao',"华文行楷",serif; font-weight:900; color:#120c06; white-space:nowrap; line-height:1; }
.c.basic .name { top:6px; left:26px; right:2px; text-align:center; font-size:96px; }
.c.other .name { top:6px; left:30px; right:5px; text-align:center; font-size:26px; }
.c .tag { position:absolute; top:40px; left:30px; right:5px; text-align:center; z-index:3; }
.c .tag span { display:inline-block; border:1px solid #8a6a3a; border-radius:3px; padding:0 5px; font-size:10px; color:#6b4a24; background:rgba(255,248,230,.6); }
.c .art { position:absolute; left:5px; right:5px; top:60px; bottom:5px; z-index:1; background-size:cover; background-position:center; border:1px solid #5a4020; filter:contrast(1.18) saturate(1.05); image-rendering:-webkit-optimize-contrast; }
.c.basic .art { top:88px; }
</style></head>
<body>
  <div class="c basic"><div class="top"><span class="num">9</span><br><span class="suit">♣</span></div><div class="name">杀</div><div class="art" style="background-image:url('/assets/cards_hd/sha.png')"></div></div>
  <div class="c basic"><div class="top"><span class="num">5</span><br><span class="suit">♦</span></div><div class="name">闪</div><div class="art" style="background-image:url('/assets/cards_hd/shan.png')"></div></div>
  <div class="c other"><div class="top"><span class="num">A</span><br><span class="suit">♦</span></div><div class="name">朱雀羽扇</div><div class="tag"><span>装备</span></div><div class="art" style="background-image:url('/assets/cards_hd/zhuque.png')"></div></div>
  <div class="c other black"><div class="top"><span class="num">7</span><br><span class="suit">♥</span></div><div class="name">无中生有</div><div class="tag"><span>锦囊</span></div><div class="art" style="background-image:url('/assets/cards_hd/wuzhong.png')"></div></div>
</body></html>
