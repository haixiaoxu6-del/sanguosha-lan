<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'HYZLSJ'; src: url('/assets/fonts/HYZLSJ.woff2') format('woff2'); font-display: swap; }
body { margin:0; background:#8a6a4a; padding:30px; display:flex; gap:26px; font-family:"FZBWKSJW",serif; }
.c { width:164px; height:230px; background:radial-gradient(ellipse at 18% 8%, rgba(90,60,30,.35), transparent 55%), radial-gradient(ellipse at 85% 92%, rgba(80,50,20,.38), transparent 60%), linear-gradient(180deg,#cdb488,#a98c5e); box-shadow: inset 0 0 46px rgba(70,45,20,.45), 0 6px 16px rgba(0,0,0,.45); border:1px solid #8c6b3f; border-radius:5px;
  box-shadow:0 6px 16px rgba(0,0,0,.45); position:relative; overflow:hidden; color:#241a10; }
.c .top { position:absolute; top:4px; left:6px; display:flex; flex-direction:column; align-items:center; width:26px; z-index:3; }
.c .num { font-size:22px; font-weight:800; line-height:1; color:#a52626; }
.c .suit { font-size:18px; line-height:1; color:#a52626; }
.c .name { position:absolute; top:22px; left:30px; right:6px; z-index:3; text-align:center;
  font-family:'HYZLSJ',"华文行楷",serif; font-size:27px; line-height:1.1; white-space:nowrap; }
.c .tag { position:absolute; top:54px; left:30px; right:6px; z-index:3; text-align:center; font-size:11px; color:#6b4a24; }
.c .art { position:absolute; left:6px; right:6px; top:74px; bottom:6px; z-index:1; background-color:#efe4cc;
  background-repeat:no-repeat; background-position:center; background-size:cover; border:1px solid rgba(140,107,63,.35); border-radius:2px; }
.c.black .num, .c.black .suit, .c.black .name { color:#241a10; }
</style></head>
<body>
  <div class="c"><div class="top"><span class="num">Q</span><span class="suit">♥</span></div><div class="name">桃</div><div class="tag">基本</div><div class="art" style="background-image:url('/assets/cards/tao.png')"></div></div>
  <div class="c black"><div class="top"><span class="num">6</span><span class="suit">♣</span></div><div class="name">乐不思蜀</div><div class="tag">锦囊</div><div class="art" style="background-image:url('/assets/cards/lebu.png')"></div></div>
  <div class="c"><div class="top"><span class="num">K</span><span class="suit">♦</span></div><div class="name">骅骝</div><div class="tag">装备</div><div class="art" style="background-image:url('/assets/cards/hualiu.png')"></div></div>
  <div class="c black"><div class="top"><span class="num">9</span><span class="suit">♠</span></div><div class="name">酒</div><div class="tag">基本</div><div class="art" style="background-image:url('/assets/cards/jiu.png')"></div></div>
</body></html>
