<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'HYZLSJ'; src: url('/assets/fonts/HYZLSJ.woff2') format('woff2'); }
body { margin:0; background:#2a1e15; width:100vw; height:100vh; position:relative; font-family:"FZBWKSJW",serif; }
.c { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:164px; height:230px;
  background:linear-gradient(180deg,#e2d0a8,#c9ad7c); border:1px solid #8c6b3f; border-radius:6px; overflow:hidden; color:#1c140c; }
.c .top { position:absolute; top:4px; left:5px; width:24px; text-align:center; z-index:3; }
.c .num { font-size:19px; font-weight:800; line-height:1; }
.c .suit { font-size:16px; line-height:1; }
.c.black .num, .c.black .suit { color:#1c140c; }
.c .name { position:absolute; top:16px; left:30px; right:4px; text-align:center; font-family:'HYZLSJ',serif; font-size:24px; line-height:1; color:#120c06; z-index:3; white-space:nowrap; }
.c .tag { position:absolute; top:54px; left:0; right:0; text-align:center; z-index:3; }
.c .tag span { display:inline-block; border:1px solid #6b4a24; border-radius:3px; padding:2px 9px; font-size:14px; color:#5a3d1c; background:rgba(255,248,230,.5); }
.c .art2 { position:absolute; left:5px; right:5px; top:88px; bottom:5px; background-size:145% auto; background-position:center; background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(ellipse 92% 92% at 50% 50%, #000 74%, transparent 100%); mask-image:radial-gradient(ellipse 92% 92% at 50% 50%, #000 74%, transparent 100%);
  filter:contrast(1.28) brightness(.9); }
</style></head>
<body>
  <div class="c black"><div class="top"><span class="num">5</span><br><span class="suit">♠</span></div><div class="name">青龙偃月刀</div><div class="tag"><span>装备</span></div><div class="art2" style="background-image:url('/assets/cards/qinglong.png')"></div></div>
</body></html>
