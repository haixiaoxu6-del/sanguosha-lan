<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css">
<style>
body { margin:0; background:#241a14; padding:60px 24px 24px; font-family:"FZBWKSJW",serif; display:flex; gap:40px; align-items:flex-start; }
.col { text-align:center; }
.cap { color:#c9b184; font-size:13px; margin-top:10px; }
/* 立绘：a 到 b；卡片本身无背景 */
.card { position:relative; width:180px; height:430px; background:transparent; }
.card .art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }
/* 武将框：从 c 到 b，和背景重叠，框内透明，不加任何背景 */
.card .frame { position:absolute; left:0; right:0; top:30px; bottom:0; border:2px solid #a98145;
  border-radius:0 0 12px 12px; background:transparent; box-shadow:inset 0 0 0 1px rgba(224,192,122,.55); pointer-events:none; }
</style></head>
<body>
  <div class="col">
    <div class="card"><img class="art" src="/assets/generals/re_zhangfei.jpg"><div class="frame"></div></div>
    <div class="cap">界张飞：a→c 无框无背景</div>
  </div>
  <div class="col">
    <div class="card"><img class="art" src="/assets/generals/re_guanyu.jpg"><div class="frame"></div></div>
    <div class="cap">界关羽</div>
  </div>
  <div class="col">
    <div class="card"><img class="art" src="/assets/generals/re_zhaoyun.jpg"><div class="frame"></div></div>
    <div class="cap">界赵云</div>
  </div>
</body></html>
