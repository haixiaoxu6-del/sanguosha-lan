<!doctype html>
<html><head><meta charset="utf-8">
<style>
body { margin:0; background:#8a6a4a; padding:30px; display:flex; gap:26px; font-family:"FZBWKSJW",serif; }
.c { width:170px; height:240px; background:linear-gradient(180deg,#f6eeda,#e6d6b6); border:1px solid #8c6b3f; border-radius:5px;
  box-shadow:0 6px 16px rgba(0,0,0,.45); position:relative; overflow:hidden; color:#241a10; }
.c .top { position:absolute; top:4px; left:6px; display:flex; align-items:flex-start; gap:2px; z-index:3; }
.c .suit { font-size:20px; line-height:1; color:#a52626; }
.c .num { font-size:22px; font-weight:800; line-height:1; color:#a52626; }
.c .name { position:absolute; top:8px; left:44px; right:8px; z-index:3; font-family:"华文行楷","STXingkai","KaiTi",serif;
  font-size:30px; line-height:1.05; letter-spacing:1px; white-space:nowrap; }
.c .tag { position:absolute; top:52px; left:8px; z-index:3; font-size:10px; border:1px solid #8a6a3a; border-radius:3px; padding:1px 4px; color:#6b4a24; background:rgba(255,248,230,.6); }
.c .art { position:absolute; left:6px; right:6px; top:70px; bottom:8px; background-size:cover; background-position:center; border-radius:2px;
  -webkit-mask-image:linear-gradient(180deg,#000 82%,transparent 100%); mask-image:linear-gradient(180deg,#000 82%,transparent 100%); }
.c.black .suit, .c.black .num, .c.black .name { color:#241a10; }
</style></head>
<body>
  <div class="c"><div class="top"><span class="suit">♥</span><span class="num">Q</span></div><div class="name">桃</div><div class="tag">基本</div><div class="art" style="background-image:url('/assets/cards/tao.png')"></div></div>
  <div class="c black"><div class="top"><span class="suit">♣</span><span class="num">6</span></div><div class="name">乐不思蜀</div><div class="tag">锦囊</div><div class="art" style="background-image:url('/assets/cards/lebu.png')"></div></div>
  <div class="c"><div class="top"><span class="suit">♦</span><span class="num">K</span></div><div class="name">骅骝</div><div class="tag">装备</div><div class="art" style="background-image:url('/assets/cards/hualiu.png')"></div></div>
  <div class="c black"><div class="top"><span class="suit">♠</span><span class="num">9</span></div><div class="name">酒</div><div class="tag">基本</div><div class="art" style="background-image:url('/assets/cards/jiu.png')"></div></div>
</body></html>
