<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css">
<style>
body { margin:0; background:#241a14; padding:40px 24px 24px; font-family:"FZBWKSJW",serif; display:flex; gap:40px; align-items:flex-start; }

.card img { width:100%; height:100%; object-fit:fill; display:block; }
</style></head>
<body>
  <div class="col"><div class="card"><img src="/assets/generals/re_zhaoyun.jpg"></div><div class="cap">界赵云 175×283</div></div>
